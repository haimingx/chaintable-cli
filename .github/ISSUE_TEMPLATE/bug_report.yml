name: Bug report
description: The CLI behaves differently from its documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a token or API key. `chaintable --dry-run` and `--debug` already mask credentials.
  - type: textarea
    id: version
    attributes:
      label: Version and platform
      description: Output of `chaintable version`.
      render: json
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with ids replaced if they are sensitive.
      render: sh
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output and exit code; include the error's `request_id` if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Where it ran
      options:
        - Terminal
        - Claude Code
        - Codex
        - CI or another program
    validations:
      required: true
