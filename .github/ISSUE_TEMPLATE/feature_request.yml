name: Feature request
description: A command, flag or behavior the CLI should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work, for example the command you would run.
  - type: dropdown
    id: context
    attributes:
      label: Main use
      options:
        - Terminal
        - Coding agents
        - CI or scripts
